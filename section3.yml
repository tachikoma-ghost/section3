# Section3 - Service Supervisor Configuration (example)
# https://github.com/tachikoma-ghost/section3
#
# section3 reads /workspace/section3.yml by default.

defaults:
  dir: /workspace        # working directory for services that don't set their own
  restart: always        # always | never | on-crash

services:
  web:
    command: /usr/local/bin/my-web-server --port 8080

  worker:
    command: /usr/local/bin/my-worker --queue default
    restart: on-crash    # restart only on non-zero exit
    depends_on:
      - web              # documented ordering; not enforced

  init-once:
    command: /usr/local/bin/migrate-db.sh
    dir: /tmp
    restart: never       # run once, don't restart
